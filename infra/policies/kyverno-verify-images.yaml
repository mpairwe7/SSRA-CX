# Section 12.4 & 15: Kyverno policy verifying Cosign image signatures and CycloneDX SBOM attestations
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ssra-verify-signed-images-and-digests
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-immutable-image-digest
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["ssra-cx"]
      validate:
        message: "All SSRA Assist container images must be pinned by immutable @sha256 digest."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
