# Section 8.2 & 12.3: Deny-all default NetworkPolicy; agent-runtime may only egress via agentgateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime-single-egress
  namespace: ssra-cx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ssra-agent-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ssra-experience
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssra-agentgateway
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssra-postgres
      ports:
        - protocol: TCP
          port: 5432
