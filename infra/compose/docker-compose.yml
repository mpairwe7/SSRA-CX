# Hardened SSRA Assist Docker Compose Stack (Compose Specification 2026 — Section 15, 16, 18)
name: ssra-cx

x-hardened-defaults: &hardened-defaults
  security_opt:
    - no-new-privileges:true
    - seccomp:../policies/seccomp-sovereign-default.json
  cap_drop:
    - ALL
  pids_limit: 256
  restart: on-failure:5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *hardened-defaults
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ssra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ssra_cx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql:rw
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssra -d ssra_cx"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    <<: *hardened-defaults
    image: valkey/valkey:8.1-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /data:rw,noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    <<: *hardened-defaults
    image: nats:2.11-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
    networks:
      - sovereign_internal_net

  keycloak:
    <<: *hardened-defaults
    image: quay.io/keycloak/keycloak:26.4.11
    command:
      - "start-dev"
      - "--import-realm"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
      - "--features=passkeys,token-exchange-standard:v2"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ssra_cx
      KC_DB_USERNAME: ssra
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: passkeys,token-exchange-standard:v2
    volumes:
      - ../keycloak/ssra-realm.json:/opt/keycloak/data/import/ssra-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-runtime:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/agent-runtime/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8001"
    # Principle 8: Attached only to internal network; zero direct host port exposure or outbound internet access
    networks:
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  channel-gateway:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/channel-gateway/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge_net:
    driver: bridge
  sovereign_internal_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
    driver: local
