# Hardened SSRA Assist Docker Compose Stack (Compose Specification 2026 — Section 15, 16, 18)
name: ssra-cx

x-hardened-defaults: &hardened-defaults
  security_opt:
    - no-new-privileges:true
    - seccomp:../policies/seccomp-sovereign-default.json
  cap_drop:
    - ALL
  pids_limit: 256
  restart: on-failure:5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *hardened-defaults
    image: pgvector/pgvector:pg18@sha256:4b6a6b8f28d2c6a92f99603f03923eb086c25780289fb0a756f5eb93f4c8551f
    environment:
      POSTGRES_USER: ssra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ssra_cx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql:rw
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssra -d ssra_cx"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    <<: *hardened-defaults
    image: valkey/valkey:8.1-alpine@sha256:b09c66a45b2f8d722b3e302349468941f86655a9a9d6a0ef99a629874437e721
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /data:rw,noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    <<: *hardened-defaults
    image: nats:2.11-alpine@sha256:94964f02bc4f73d1c1660812f9b32b8d57072e1146b7d318d19e7e467710a224
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    <<: *hardened-defaults
    image: quay.io/keycloak/keycloak:26.4.11@sha256:f8f53f5990775d2b3056f5d5e19538909887821b6064232d032a27a4d5014140
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,size=64m
    command:
      - "start-dev"
      - "--import-realm"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
      - "--features=passkeys,token-exchange-standard:v2,dpop"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ssra_cx
      KC_DB_USERNAME: ssra
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_CACHE: ispn
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: passkeys,token-exchange-standard:v2,dpop
    volumes:
      - ../keycloak/ssra-realm.json:/opt/keycloak/data/import/ssra-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agentgateway:
    <<: *hardened-defaults
    image: ghcr.io/agentgateway/agentgateway:0.11.2@sha256:6c133b6e5951a9d63f1d0b7c7742a9573f5b107c7026d8d4a7c8759467e19b47
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    expose:
      - "8088"
    volumes:
      - ../gateway/routes.yaml:/etc/agentgateway/routes.yaml:ro
    networks:
      - sovereign_internal_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-runtime:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/agent-runtime/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8001"
    # Principle 8: Attached only to internal network; zero direct host port exposure or outbound internet access
    networks:
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy
      agentgateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  channel-gateway:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: services/channel-gateway/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
        INTERNAL_RUNTIME_URL: http://agent-runtime:8001
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
      INTERNAL_RUNTIME_URL: http://agent-runtime:8001
    ports:
      - "127.0.0.1:3033:3000"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy

  console:
    <<: *hardened-defaults
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3034:3001"
    networks:
      - edge_net
      - sovereign_internal_net
    depends_on:
      api:
        condition: service_healthy

networks:
  edge_net:
    driver: bridge
  sovereign_internal_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
    driver: local
