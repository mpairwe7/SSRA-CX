# NCA Sovereign Production & DR Docker Compose Overlay (Compose Specification 2026)
# Usage:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.prod.yml --profile prod up -d --wait
name: ssra-cx

services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=cp %p /var/lib/postgresql/wal_archive/%f"
    volumes:
      - pgdata:/var/lib/postgresql:rw
      - wal_archive:/var/lib/postgresql/wal_archive:rw
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  postgres-wal-archiver:
    image: pgvector/pgvector:pg18
    profiles: ["prod", "dr"]
    command:
      - "pg_receivewal"
      - "--host=postgres"
      - "--username=ssra"
      - "--directory=/var/lib/postgresql/wal_archive"
      - "--synchronous"
      - "--no-password"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: on-failure:5
    environment:
      PGHOST: postgres
      PGUSER: ssra
      WAL_ARCHIVE_S3_BUCKET: ${WAL_ARCHIVE_S3_BUCKET:-s3://ssra-nca-backups/postgres18-wal}
    volumes:
      - wal_archive:/var/lib/postgresql/wal_archive:rw
    networks:
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  vllm-sovereign:
    image: vllm/vllm-openai:v0.26.0
    profiles: ["prod", "gpu"]
    command:
      - "--model"
      - "/home/developer/huggingface_cache/hub/models--Sunbird--Sunflower-Qwen3.5-9B/snapshots/c56081c5024b1c11186a69898f5f6a7a2dabe454"
      - "--served-model-name"
      - "ssra-sovereign/sunflower-qwen3.5-9b"
      - "--guided-decoding-backend"
      - "xgrammar"
      - "--enable-prefix-caching"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    restart: on-failure:3
    environment:
      HF_HOME: /home/developer/huggingface_cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - type: bind
        source: /home/developer/huggingface_cache
        target: /home/developer/huggingface_cache
        read_only: true
    networks:
      - sovereign_internal_net
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  agent-runtime:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  wal_archive:
    driver: local
