# NCA Sovereign Production & DR Docker Compose Overlay (Compose Specification 2026)
# Usage:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.prod.yml --profile prod up -d --wait
name: ssra-cx

services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=cp %p /var/lib/postgresql/wal_archive/%f"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql:rw
      - wal_archive:/var/lib/postgresql/wal_archive:rw
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  postgres-wal-archiver:
    image: pgvector/pgvector:pg18@sha256:4b6a6b8f28d2c6a92f99603f03923eb086c25780289fb0a756f5eb93f4c8551f
    profiles: ["prod", "dr"]
    command:
      - "pg_receivewal"
      - "--host=postgres"
      - "--username=ssra"
      - "--directory=/var/lib/postgresql/wal_archive"
      - "--synchronous"
      - "--no-password"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: on-failure:5
    environment:
      PGHOST: postgres
      PGUSER: ssra
      WAL_ARCHIVE_S3_BUCKET: ${WAL_ARCHIVE_S3_BUCKET:-s3://ssra-nca-backups/postgres18-wal}
    volumes:
      - wal_archive:/var/lib/postgresql/wal_archive:rw
    networks:
      - sovereign_internal_net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  vllm-sovereign:
    image: vllm/vllm-openai:v0.26.0@sha256:32e7226d272852735948f506253b6f750317c91097d72801941279c958173688
    profiles: ["prod", "gpu"]
    command:
      - "--model"
      - "/home/developer/huggingface_cache/hub/models--Sunbird--Sunflower-Qwen3.5-9B/snapshots/c56081c5024b1c11186a69898f5f6a7a2dabe454"
      - "--served-model-name"
      - "ssra-sovereign/sunflower-qwen3.5-9b"
      - "--guided-decoding-backend"
      - "xgrammar"
      - "--enable-prefix-caching"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    restart: on-failure:3
    environment:
      HF_HOME: /home/developer/huggingface_cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - type: bind
        source: /home/developer/huggingface_cache
        target: /home/developer/huggingface_cache
        read_only: true
    networks:
      - sovereign_internal_net
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    secrets:
      - postgres_password
      - openbao_transit_key
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  keycloak:
    build:
      context: ../..
      dockerfile: infra/keycloak/Dockerfile
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "export KC_DB_PASSWORD=\"$(cat /run/secrets/postgres_password)\" KC_BOOTSTRAP_ADMIN_PASSWORD=\"$(cat /run/secrets/keycloak_admin_password)\" && exec /opt/keycloak/bin/kc.sh \"$$@\""
      - "--"
    command:
      - "start"
      - "--optimized"
      - "--import-realm"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,size=64m
    secrets:
      - postgres_password
      - keycloak_admin_password
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ssra_cx
      KC_DB_USERNAME: ssra
      KC_DB_PASSWORD: ""
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
      KEYCLOAK_ADMIN_PASSWORD: ""
      KC_TRANSACTION_XA_ENABLED: "false"
      KC_DB_POOL_INITIAL_SIZE: "5"
      KC_DB_POOL_MIN_SIZE: "5"
      KC_DB_POOL_MAX_SIZE: "30"
      KC_DB_CONNECT_TIMEOUT: "10s"
      KC_HOSTNAME: ${KC_HOSTNAME:-https://sso.ssra.gov.ss}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_MAX_QUEUED_REQUESTS: "256"
      KC_SHUTDOWN_TIMEOUT: "15s"
      KC_LOG_CONSOLE_OUTPUT: "json"
      KC_CACHE: ispn
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: passkeys,token-exchange-standard:v2,dpop
      JAVA_OPTS_KC_HEAP: "1024m"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  agentgateway:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  agent-runtime:
    secrets:
      - openbao_transit_key
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  channel-gateway:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  valkey:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nats:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

secrets:
  postgres_password:
    file: ${SSRA_POSTGRES_PASSWORD_FILE:-/run/ssra-secrets/postgres_password}
  keycloak_admin_password:
    file: ${SSRA_KEYCLOAK_ADMIN_PASSWORD_FILE:-/run/ssra-secrets/keycloak_admin_password}
  openbao_transit_key:
    file: ${SSRA_OPENBAO_TRANSIT_KEY_FILE:-/run/ssra-secrets/openbao_transit_key}

volumes:
  wal_archive:
    driver: local
