apiVersion: v1
kind: Service
metadata:
  name: ssra-agentgateway
  namespace: ssra-cx
spec:
  selector:
    app.kubernetes.io/name: ssra-agentgateway
  ports:
    - name: http-mcp
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: ssra-agent-runtime
  namespace: ssra-cx
spec:
  selector:
    app.kubernetes.io/name: ssra-agent-runtime
  ports:
    - name: http-agui
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: ssra-api
  namespace: ssra-cx
spec:
  selector:
    app.kubernetes.io/name: ssra-api
  ports:
    - name: http-api
      port: 8000
      targetPort: 8000
