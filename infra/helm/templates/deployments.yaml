apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssra-agent-runtime
  namespace: ssra-cx
  labels:
    app.kubernetes.io/name: ssra-agent-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ssra-agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssra-agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: "{{ .Values.registry }}/ssra-agent-runtime@{{ .Values.runtimeDigest }}"
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
