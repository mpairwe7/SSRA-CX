# Argo Rollouts Progressive Canary with SLO & Safety Gate Analysis (Section 15)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ssra-agent-runtime
  namespace: ssra-cx
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: ssra-slo-and-eval-gate
        - setWeight: 50
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: ssra-slo-and-eval-gate
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ssra-slo-and-eval-gate
  namespace: ssra-cx
spec:
  metrics:
    - name: availability-slo
      interval: 1m
      successCondition: result[0] >= 0.999
      provider:
        prometheus:
          address: http://mimir.ssra-obs.svc.cluster.local:9009/prometheus
          query: |
            1 - (sum(rate(http_requests_total{namespace="ssra-cx",status=~"5.."}[5m])) / sum(rate(http_requests_total{namespace="ssra-cx"}[5m])))
    - name: zero-numeric-provenance-failures
      interval: 1m
      successCondition: result[0] == 0
      provider:
        prometheus:
          address: http://mimir.ssra-obs.svc.cluster.local:9009/prometheus
          query: |
            sum(increase(ssra_guardrail_triggers_total{guard="numeric_provenance"}[5m]))
