# CloudNativePG HA PostgreSQL 18 + pgvector Cluster with Continuous WAL Archiving & PITR (Sections 5, 13, 15)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ssra-postgres18-ha
  namespace: ssra-cx
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0
  enableSuperuserAccess: false
  postgresql:
    shared_preload_libraries:
      - "vector"
      - "pg_trgm"
    parameters:
      timezone: "UTC"
      hnsw.iterative_scan: "relaxed_order"
      row_security: "on"
  storage:
    size: 200Gi
    storageClass: nca-nvme-replicated
  backup:
    barmanObjectStore:
      destinationPath: "s3://ssra-nca-backups/postgres18-wal"
      endpointURL: "https://s3.nca.gov.ss"
      wal:
        compression: zstd
        maxParallel: 4
    retentionPolicy: "30d"
