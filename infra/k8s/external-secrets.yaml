# External Secrets Operator Integration with In-Country OpenBao KMS/Secrets (Sections 12.3 & 15)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ssra-openbao-store
spec:
  provider:
    vault:
      server: "https://openbao.ssra.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ssra-cx-workload"
