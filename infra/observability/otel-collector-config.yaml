# Section 14.3: OpenTelemetry Collector (2026) with memory_limiter, GenAI/PII scrubbing & tail sampling
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 1024
    timeout: 5s
  attributes/redact_pii:
    actions:
      - key: user.tin
        action: delete
      - key: user.phone
        action: delete
      - key: user.email
        action: delete
      - key: user.passport
        action: delete
      - key: auth.otp
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: keep-errors-and-guardrail-triggers
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-turns
        type: latency
        latency:
          threshold_ms: 3000
      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 25

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: false
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_pii, tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_pii, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
