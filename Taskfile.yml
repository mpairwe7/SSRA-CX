version: "3"

env:
  PYTHONUNBUFFERED: "1"
  TZ: "UTC"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  gen:
    desc: Generate Pydantic v2, TypeScript, Zod 4 schemas, OpenAPI client, ingested corpus snapshot manifest, CycloneDX SBOM, and SLSA v1.0 provenance
    cmds:
      - uv run python tools/codegen/generate_contracts.py
      - uv run python tools/codegen/export_openapi.py
      - uv run python tools/ingest_public_corpus.py
      - uv run python tools/generate_sbom.py

  lint:
    desc: Run Ruff, basedpyright (strict), import-linter, JSON Schema validation, gitleaks, Biome, and TypeScript tsc
    preconditions:
      - sh: node tools/verify_node_runtime.mjs
        msg: Activate a Node.js runtime that satisfies package.json engines.node before running task lint.
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run basedpyright
      - uv run lint-imports
      - uv run python tools/validate_schemas.py
      - uv run python tools/check_openapi_diff.py
      - uv run python tools/verify_frontend_budgets_and_a11y.py
      - uv run python tools/verify_supply_chain_and_signatures.py
      - gitleaks detect --no-git
      - corepack pnpm run lint
      - corepack pnpm run typecheck

  test:
    desc: Run Python (pytest + Hypothesis), rules engine mutation testing, coverage gates (>=98% domain and overall), TypeScript (Vitest), and rendered-browser (Playwright) test suites
    preconditions:
      - sh: node tools/verify_node_runtime.mjs
        msg: Activate a Node.js runtime that satisfies package.json engines.node before running task test.
    cmds:
      # Do not inherit a shared or mounted TMPDIR: pytest requires an owner-safe local root.
      - PYTEST_DEBUG_TEMPROOT=/tmp uv run pytest -q
      - uv run python tools/verify_rules_mutations.py
      - PYTEST_DEBUG_TEMPROOT=/tmp uv run python tools/check_coverage_gate.py
      - corepack pnpm run test
      - corepack pnpm exec playwright test

  eval:
    desc: Run SSRA Assist evaluations, benchmark ASGI SLOs, and audit phase evidence/blockers without advancing gates
    cmds:
      - PYTEST_DEBUG_TEMPROOT=/tmp uv run pytest evals/suites evals/redteam -q
      - uv run python tools/run_eval_report.py
      - uv run python tools/benchmark_asgi.py
      - uv run python tools/run_dr_restore_drill.py
      - uv run python tools/verify_phase_gates.py

  up:
    desc: Bring up the local SSRA Assist stack via Docker Compose and run end-to-end health & AG-UI smoke verification
    cmds:
      - docker compose -f infra/compose/docker-compose.yml up -d --build
      - uv run python tools/smoke_test_stack.py

  down:
    desc: Stop the local SSRA Assist Docker Compose stack
    cmds:
      - docker compose -f infra/compose/docker-compose.yml down --remove-orphans
