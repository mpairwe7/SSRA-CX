[project]
name = "ssra-llm"
version = "0.1.0"
description = "SSRA Assist provider-agnostic ModelPort, layered prompt builder (L0-L5 spotlighting), termbase loader, and 5-step degradation ladder"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "pyyaml==6.0.2",
    "ssra-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_llm"]

[tool.uv.sources]
ssra-core = { workspace = true }
