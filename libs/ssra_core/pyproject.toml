[project]
name = "ssra-core"
version = "0.1.0"
description = "SSRA Assist core primitives: settings, logging, RFC 9457 errors, UUIDv7, Africa/Juba clock, and generated contracts"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "orjson==3.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_core"]
