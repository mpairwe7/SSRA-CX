[project]
name = "ssra-security"
version = "0.1.0"
description = "SSRA Assist security primitives: OAuth 2.1 RFC 8693 subject binding, confirmation tokens, Presidio-grade PII redaction, and hash-chained WORM audit log"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "cryptography>=44.0.0",
    "ssra-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_security"]

[tool.uv.sources]
ssra-core = { workspace = true }
