[project]
name = "ssra-adapters"
version = "0.1.0"
description = "SSRA Assist anti-corruption ports and synthetic mock adapters for e-Tax, e-Customs, BoSS, and official channels"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "ssra-core",
    "ssra-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_adapters"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
