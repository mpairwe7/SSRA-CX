[project]
name = "ssra-mcp"
version = "0.1.0"
description = "Stateless MCP 2026-07-28 server framework with OAuth 2.1 subject binding, JSON Schema 2020-12 validation, confirmation tokens, and provenance envelopes"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.14.0",
    "jsonschema==4.25.1",
    "ssra-core",
    "ssra-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_mcp"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
