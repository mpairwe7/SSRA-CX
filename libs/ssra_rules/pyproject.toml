[project]
name = "ssra-rules"
version = "0.1.0"
description = "SSRA Assist deterministic rules engine and versioned Tax Facts registry"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "pyyaml==6.0.2",
    "ssra-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_rules"]

[tool.uv.sources]
ssra-core = { workspace = true }
