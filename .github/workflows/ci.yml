# Portable DevSecOps CI Pipeline (Section 12.4 & 15, ADR-015)
# Supply-chain rule: Every GitHub Action is pinned by immutable 40-char commit SHA.

name: ssra-cx-ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Unit, Contract, Schema & Eval Slice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: "9.15.9"

      - name: Setup uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1

      - name: Install Gitleaks (SHA-256 verified) & Poppler on runner
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz

      - name: Install dependencies (frozen lockfiles + 7-day cooldown)
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked

      - name: Run Taskfile gen, lint, test, and eval gates (lockfile-pinned Task CLI)
        run: |
          pnpm exec task gen
          git diff --exit-code
          pnpm exec task lint
          pnpm exec task test
          pnpm exec task eval
