title = "SSRA Assist Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist SHA-256 contract digests, TaxFact key identifiers, local untracked .env, and prose phrase 'S3-compatible'"
paths = [
  '''^\.env$''',
]
regexes = [
  '''S3-compatible''',
  '''[0-9a-f]{64}''',
  '''(?:paye|pit|bpt|wht|excise|customs|gaming|penalty|filing|payment|tin|etax|fiscal)\.[a-z0-9_.]+''',
]
