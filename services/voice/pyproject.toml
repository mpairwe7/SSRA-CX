[project]
name = "ssra-voice"
version = "0.1.0"
description = "SSRA Assist Phase 4 Voice/IVR Pipeline (Whisper + Meta Omnilingual ASR WER gate)"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic==2.14.0",
    "ssra-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_voice"]

[tool.uv.sources]
ssra-core = { workspace = true }
