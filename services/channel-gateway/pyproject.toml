[project]
name = "ssra-channel-gateway"
version = "0.1.0"
description = "SSRA Assist Channel Gateway: WhatsApp, SMS (GSM-7/UCS-2), USSD, and Voice webhook verification, deduplication, and CloudEvents 1.0 normalisation"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "ssra-core",
    "ssra-security",
    "ssra-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_channel_gateway"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-testing = { workspace = true }
