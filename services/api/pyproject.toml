[project]
name = "ssra-api"
version = "0.1.0"
description = "SSRA Assist FastAPI Modular Monolith (conversations, identity_link, cases, appointments, knowledge_admin, consent, analytics_api, admin)"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "ssra-core",
    "ssra-security",
    "ssra-rules",
    "ssra-adapters",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_api"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-rules = { workspace = true }
ssra-adapters = { workspace = true }
