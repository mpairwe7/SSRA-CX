[project]
name = "ssra-mcp-tax-facts"
version = "0.1.0"
description = "SSRA Assist MCP Server: tax-facts (get_tax_fact, list_tax_facts, calculate_paye_estimate, calculate_withholding_estimate)"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "ssra-core",
    "ssra-security",
    "ssra-rules",
    "ssra-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_mcp_tax_facts"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-rules = { workspace = true }
ssra-mcp = { workspace = true }
