[project]
name = "ssra-mcp-payments-info"
version = "0.1.0"
description = "SSRA Assist MCP Server: payments-info (list_payment_channels, get_payment_instructions)"
requires-python = ">=3.12,<3.16"
dependencies = ["fastapi==0.139.2", "pydantic==2.14.0", "pydantic-settings==2.15.0", "ssra-core", "ssra-security", "ssra-mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_mcp_payments_info"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-mcp = { workspace = true }
