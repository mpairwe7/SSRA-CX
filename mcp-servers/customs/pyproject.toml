[project]
name = "ssra-mcp-customs"
version = "0.1.0"
description = "SSRA Assist MCP Server: customs (get_declaration_status, lookup_tariff, estimate_duties)"
requires-python = ">=3.12,<3.16"
dependencies = ["fastapi==0.139.2", "pydantic==2.14.0", "pydantic-settings==2.15.0", "ssra-core", "ssra-security", "ssra-adapters", "ssra-mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_mcp_customs"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-adapters = { workspace = true }
ssra-mcp = { workspace = true }
