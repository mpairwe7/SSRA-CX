[project]
name = "ssra-mcp-knowledge"
version = "0.1.0"
description = "SSRA Assist MCP Server: knowledge (search_knowledge, get_section, list_forms, get_office_info)"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "ssra-core",
    "ssra-security",
    "ssra-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssra_mcp_knowledge"]

[tool.uv.sources]
ssra-core = { workspace = true }
ssra-security = { workspace = true }
ssra-mcp = { workspace = true }
