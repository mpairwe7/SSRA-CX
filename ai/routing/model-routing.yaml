node_routes:
  input_guard:
    tier: "fast_guard"
    primary_model: "ssra-sovereign/sunflower-qwen3.5-9b"
    max_tokens: 256
    timeout_ms: 1200
  understand:
    tier: "fast_router"
    primary_model: "ssra-sovereign/sunflower-qwen3.5-9b"
    max_tokens: 512
    timeout_ms: 1500
  compose:
    tier: "multilingual_composer"
    primary_model: "ssra-sovereign/sunflower-qwen3.5-9b"
    secondary_model: "ssra-sovereign/qwen3-8b"
    max_tokens: 1024
    timeout_ms: 4500

external_providers:
  enabled: false  # Blocked by default until SSRA approves OQ-004 under Zero-Data-Retention
  allowed_tiers: ["T0"]

degradation_ladder:
  1: "PRIMARY_SOVEREIGN_VLLM"
  2: "SECONDARY_SOVEREIGN_VLLM"
  3: "SELF_HOSTED_CPU_QUANTIZED"
  4: "RETRIEVAL_ONLY_ANSWER_CARDS"
  5: "STATIC_FAQ_PLUS_CALLBACK"
