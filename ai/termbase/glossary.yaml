# SSRA Multilingual Tax Termbase (Section 2, 7 & 16)
# Enforced in prompt generation, cross-lingual retrieval expansion, and multilingual evaluations across all 8 BCP-47 languages:
# Tier A: en | Tier B: ar (RTL), pga | Tier C: din (Dinka), nus (Nuer), bfa (Bari), zne (Zande), shk (Shilluk).

version: "2026.10.1"
owner: "SSRA Communications & Legal Directorate (OQ-008)"
terms:
  - id: "term_ssra"
    en: "South Sudan Revenue Authority (SSRA)"
    synonyms_en: ["NRA", "National Revenue Authority"]
    ar: "هيئة إيرادات جنوب السودان (SSRA)"
    pga: "South Sudan Revenue Authority (SSRA / NRA)"
    din: "Akuma de Wëu de Paguot Thudän (SSRA)"
    nus: "Kuma Yiööth Paguot Thudän (SSRA)"
    bfa: "Kiko'jin na Silingi ta Südän Nakwacak (SSRA)"
    zne: "Basunungba Marã Rago Südän (SSRA)"
    shk: "Koma Jami Piny Sudan (SSRA)"
    notes: "Renamed from National Revenue Authority (NRA) in October 2023; treat SSRA and NRA as synonyms."

  - id: "term_tin"
    en: "Taxpayer Identification Number (TIN)"
    ar: "الرقم التعريفي الضريبي (TIN)"
    pga: "Namba ta Dariba (TIN)"
    din: "Namba de Ajul Wëu (TIN)"
    nus: "Namba Juäärä Yiööth (TIN)"
    bfa: "Namba lo Kaser (TIN)"
    zne: "Namba Marã (TIN)"
    shk: "Namba Ocul Jami (TIN)"
    notes: "Issued online via https://etax.nra.gov.ss/."

  - id: "term_tcc"
    en: "Tax Compliance Certificate (TCC)"
    ar: "شهادة الامتثال الضريبي (TCC)"
    pga: "Shahada ta Imtisal ta Dariba (TCC)"
    din: "Waraga de Cuɔk de Wëu (TCC)"
    nus: "Waraga Cuɔk Yiööth (TCC)"
    bfa: "Waraga lo Kaser (TCC)"
    zne: "Waraga Marã (TCC)"
    shk: "Waraga Ocul Jami (TCC)"
    notes: "Issued exclusively via the National e-Tax System and verified at https://www.nra.gov.ss/tools."

  - id: "term_paye"
    en: "Personal Income Tax / Pay-As-You-Earn (PAYE)"
    ar: "ضريبة الدخل الشخصي / الدفع عند الكسب (PAYE)"
    pga: "Dariba ta Mahiya (PAYE)"
    din: "Ajul de Ariöp de Luɔi (PAYE)"
    nus: "Yiööth Luɔi (PAYE)"
    bfa: "Kaser lo Ruba (PAYE)"
    zne: "Marã Sunge (PAYE)"
    shk: "Ocul Tic (PAYE)"
    notes: "Withheld monthly by employers and remitted via e-Tax by day 15 of the following month."

  - id: "term_etax"
    en: "National e-Tax System (etax.nra.gov.ss)"
    ar: "نظام الضرائب الإلكتروني الوطني (etax.nra.gov.ss)"
    pga: "Nizam ta e-Tax (etax.nra.gov.ss)"
    din: "Nizam de e-Tax (etax.nra.gov.ss)"
    nus: "Nizam e-Tax (etax.nra.gov.ss)"
    bfa: "Nizam lo e-Tax (etax.nra.gov.ss)"
    zne: "Nizam e-Tax (etax.nra.gov.ss)"
    shk: "Nizam e-Tax (etax.nra.gov.ss)"
    notes: "Official portal for registration, filing, and bank payment remittance."

  - id: "term_bpt"
    en: "Business Profit Tax (BPT)"
    ar: "ضريبة أرباح الأعمال (BPT)"
    pga: "Dariba ta Arbah al-A'mal (BPT)"
    din: "Ajul de Rïöök de Ɣɔɔc (BPT)"
    nus: "Yiööth Juäärä Biäc (BPT)"
    bfa: "Kaser lo Biyasa (BPT)"
    zne: "Marã Bagaa (BPT)"
    shk: "Ocul Biyaca (BPT)"
    notes: "30% standard flat rate on taxable net profit and 4% advance BPT on imported goods under Financial Act 2024/2025."

  - id: "term_wht"
    en: "Withholding Tax (WHT)"
    ar: "ضريبة الاستقطاع من المنبع (WHT)"
    pga: "Dariba Mustaqta'a min al-Manba (WHT)"
    din: "Ajul Määc në Cök (WHT)"
    nus: "Yiööth Kääp Thar (WHT)"
    bfa: "Kaser lo Mukta (WHT)"
    zne: "Marã Rogo Gpara (WHT)"
    shk: "Ocul Kwany Thar (WHT)"
    notes: "Deducted at source on contracted goods/services, rent, technical fees, government contractors, and mobile money commissions."

  - id: "term_excise"
    en: "Excise Tax"
    ar: "الضريبة الانتقائية (Excise Tax)"
    pga: "Dariba Intiqa'iya (Excise Tax)"
    din: "Ajul de Käke Ɣɔɔc (Excise Tax)"
    nus: "Yiööth Jami (Excise Tax)"
    bfa: "Kaser lo Toret (Excise Tax)"
    zne: "Marã Ahe (Excise Tax)"
    shk: "Ocul Jami (Excise Tax)"
    notes: "Charged on excisable goods (beverages, spirits, tobacco, cosmetics, motor vehicles) and specified services."

  - id: "term_customs_cif"
    en: "Customs Duty & Bank of South Sudan (BoSS) Official Exchange Rate"
    ar: "الرسوم الجمركية وسعر الصرف الرسمي لبنك جنوب السودان (BoSS)"
    pga: "Gamarik wa Si'ir al-Sarf al-Rasmi ta Bank of South Sudan (BoSS)"
    din: "Gamarik ku Wëu de Bank of South Sudan (BoSS)"
    nus: "Gamarik kä Bank of South Sudan (BoSS)"
    bfa: "Gamarik ko Bank of South Sudan (BoSS)"
    zne: "Gamarik rogo Bank of South Sudan (BoSS)"
    shk: "Gamarik yi Bank of South Sudan (BoSS)"
    notes: "Computed on CIF value converted into SSP strictly at the official BoSS exchange rate."

  - id: "term_einvoice"
    en: "B2B Electronic Invoice (e-Invoice)"
    ar: "الفاتورة الإلكترونية بين الشركات (B2B e-Invoice)"
    pga: "Fatura Elektroniya B2B (e-Invoice)"
    din: "Waraga de Ɣɔɔc Online (B2B e-Invoice)"
    nus: "Waraga Biäc Online (B2B e-Invoice)"
    bfa: "Waraga lo Biyasa Online (B2B e-Invoice)"
    zne: "Waraga Bagaa Online (B2B e-Invoice)"
    shk: "Waraga Biyaca Online (B2B e-Invoice)"
    notes: "Generated free of charge on https://etax.nra.gov.ss/ and verified at https://www.nra.gov.ss/tools/e-invoice-search."

  - id: "term_appeals_board"
    en: "Tax Appeals Board (Tier T4 Human-Only)"
    ar: "مجلس الاستئناف الضريبي (Tier T4)"
    pga: "Majlis al-Isti'naf ta Dariba (Tier T4)"
    din: "Akut de Luk de Ajul (Tier T4)"
    nus: "Luk Yiööth (Tier T4)"
    bfa: "Putet lo Kaser (Tier T4)"
    zne: "Bambata Ngbanga Marã (Tier T4)"
    shk: "Luk Ocul Jami (Tier T4)"
    notes: "Statutory board under Section 49 of the Taxation Act 2009; all disputes route to human staff."
